<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:675px; }
  .card {
    position:relative; width:1200px; height:675px;
    background:#F3EFE6; overflow:hidden;
    font-family: Georgia, 'Times New Roman', serif;
    -webkit-font-smoothing: antialiased;
  }
  .topbar { position:absolute; top:0; left:0; width:1200px; height:8px; background:#3D5B3F; }
  .title {
    position:absolute; left:0; top:38px; width:1200px; text-align:center;
    color:#1C1A17; font-size:38px; font-weight:700;
  }
  .subtitle {
    position:absolute; left:0; top:94px; width:1200px; text-align:center;
    color:#4A4845; font-style:italic; font-size:19px;
  }
  .footer {
    position:absolute; left:0; top:636px; width:1200px; text-align:center;
    color:#908D84; font-size:15px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="topbar"></div>
    <div class="title">Where the alarm budget holds</div>
    <div class="subtitle">Two ways a healthy fleet differs from itself — and the measured edges of the FDR guarantee (simulation)</div>

    <svg width="1200" height="490" viewBox="0 0 1200 490" style="position:absolute; top:140px; left:0;" xmlns="http://www.w3.org/2000/svg">
      <!-- plot area: x 140..1040 maps ICC 0..16% ; y 420..80 maps sigma 0..0.7 -->

      <!-- gridlines -->
      <g stroke="#E3DDD0" stroke-width="1">
        <line x1="365" y1="80" x2="365" y2="420"/>
        <line x1="590" y1="80" x2="590" y2="420"/>
        <line x1="815" y1="80" x2="815" y2="420"/>
        <line x1="140" y1="323" x2="1040" y2="323"/>
        <line x1="140" y1="226" x2="1040" y2="226"/>
        <line x1="140" y1="129" x2="1040" y2="129"/>
      </g>

      <!-- ICC breach band: 6.32..8.36% -> x 495..610, full height -->
      <rect x="495" y="80" width="115" height="340" fill="#8A3324" opacity="0.13"/>
      <line x1="495" y1="80" x2="495" y2="420" stroke="#8A3324" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.7"/>
      <line x1="610" y1="80" x2="610" y2="420" stroke="#8A3324" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.7"/>

      <!-- sigma breach band: 0.15..0.31 -> y 347..269 -->
      <rect x="140" y="269" width="900" height="78" fill="#8A3324" opacity="0.13"/>
      <line x1="140" y1="347" x2="1040" y2="347" stroke="#8A3324" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.7"/>
      <line x1="140" y1="269" x2="1040" y2="269" stroke="#8A3324" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.7"/>

      <!-- gate region: ICC 0..4% (x 140..365), sigma 0..0.15 (y 347..420) -->
      <rect x="140" y="347" width="225" height="73" fill="#3D5B3F" opacity="0.18"/>
      <rect x="140" y="347" width="225" height="73" fill="none" stroke="#3D5B3F" stroke-width="2.5"/>

      <!-- axes -->
      <g stroke="#7D7A74" stroke-width="1.5">
        <line x1="140" y1="420" x2="1040" y2="420"/>
        <line x1="140" y1="80" x2="140" y2="420"/>
      </g>

      <!-- x ticks/labels -->
      <g fill="#7A786F" font-family="Georgia, serif" font-size="14" text-anchor="middle">
        <text x="140" y="443">0%</text>
        <text x="365" y="443">4%</text>
        <text x="590" y="443">8%</text>
        <text x="815" y="443">12%</text>
        <text x="1040" y="443">16%</text>
      </g>
      <text x="590" y="474" fill="#4A4845" font-family="Georgia, serif" font-size="16" text-anchor="middle">persistent per-unit quirk share (ICC) — how much of behavior is a unit's permanent personality</text>

      <!-- y ticks/labels -->
      <g fill="#7A786F" font-family="Georgia, serif" font-size="14" text-anchor="end">
        <text x="130" y="425">0</text>
        <text x="130" y="328">0.2</text>
        <text x="130" y="231">0.4</text>
        <text x="130" y="134">0.6</text>
      </g>
      <text x="38" y="250" fill="#4A4845" font-family="Georgia, serif" font-size="16" text-anchor="middle" transform="rotate(-90 38 250)">noise-scale spread (ς)</text>
      <text x="62" y="250" fill="#7A786F" font-family="Georgia, serif" font-size="13" font-style="italic" text-anchor="middle" transform="rotate(-90 62 250)">how much units differ in noisiness · 0.15 ≈ ±16%</text>

      <!-- gate label -->
      <text x="152" y="372" fill="#3D5B3F" font-family="Georgia, serif" font-size="16" font-weight="bold">guarantee holds</text>
      <text x="152" y="392" fill="#3D5B3F" font-family="Georgia, serif" font-size="13" font-style="italic">ICC ≤ ~4% and ς ≤ ~0.15</text>
      <text x="152" y="409" fill="#3D5B3F" font-family="Georgia, serif" font-size="13" font-style="italic">metered live · revoked in code if left</text>

      <!-- ICC breach label -->
      <rect x="462" y="88" width="180" height="62" rx="5" fill="#F3EFE6" opacity="0.92"/>
      <text x="552" y="106" fill="#8A3324" font-family="Georgia, serif" font-size="15" font-weight="bold" text-anchor="middle">breach: 6.3–8.4%</text>
      <text x="552" y="125" fill="#4A4845" font-family="Georgia, serif" font-size="13" font-style="italic" text-anchor="middle">healthy fleet pages 3.3× its</text>
      <text x="552" y="142" fill="#4A4845" font-family="Georgia, serif" font-size="13" font-style="italic" text-anchor="middle">budget by round 320</text>

      <!-- sigma breach label -->
      <text x="1032" y="292" fill="#8A3324" font-family="Georgia, serif" font-size="15" font-weight="bold" text-anchor="end">breach: ς 0.15–0.31</text>
      <text x="1032" y="311" fill="#4A4845" font-family="Georgia, serif" font-size="13" font-style="italic" text-anchor="end">the noise channel the location gate can't see</text>

      <!-- e-BH failure point at (ICC~0, sigma 0.61): y = 420 - 0.61/0.7*340 = 124 -->
      <circle cx="168" cy="124" r="9" fill="#8A3324"/>
      <circle cx="168" cy="124" r="9" fill="none" stroke="#F3EFE6" stroke-width="2"/>
      <text x="186" y="120" fill="#8A3324" font-family="Georgia, serif" font-size="15" font-weight="bold">ς = 0.61: selection itself fails</text>
      <text x="186" y="139" fill="#4A4845" font-family="Georgia, serif" font-size="13" font-style="italic">14.8 false cordons/run from an all-healthy fleet</text>

      <!-- cascade annotation -->
      <g transform="translate(680,352)">
        <rect x="0" y="0" width="352" height="60" rx="6" fill="#FBF8F1" stroke="#DAD3C6"/>
        <text x="14" y="24" fill="#1C1A17" font-family="Georgia, serif" font-size="14" font-weight="bold">scale amplifies the breach:</text>
        <text x="14" y="45" fill="#4A4845" font-family="Georgia, serif" font-size="14">0 → 3 → 26.5 false cordons/run as the fleet doubled</text>
      </g>
    </svg>

    <div class="footer">Tessera · edges measured on clustersynth (60-day streams, to 100k simulated GPUs) · johnpwarren.dev</div>
  </div>
</body>
</html>
